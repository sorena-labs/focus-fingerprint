name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every Node version reports its own result, instead of one failure cancelling the rest.
      fail-fast: false
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the bundle is under 1.5 KB gzipped, as the README says
        run: |
          size="$(gzip -c dist/index.js | wc -c)"
          echo "dist/index.js is $size bytes gzipped."
          if [ "$size" -gt 1536 ]; then
            echo "dist/index.js is over 1536 bytes gzipped." >&2
            exit 1
          fi
      - name: Lint the package as npm will see it
        run: npx --yes publint@0.3.25
